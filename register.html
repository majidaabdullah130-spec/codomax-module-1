<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InkSpace | Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="navbar">
    <a class="brand" href="index.html">InkSpace</a>
    <nav><a href="index.html">Home</a><a href="login.html">Login</a><a class="btn btn-small active-btn" href="register.html">Register</a></nav>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <span class="eyebrow">JOIN THE COMMUNITY</span>
      <h1>Create your account</h1>
      <p class="muted">Start your own blogging journey.</p>
      <form data-form="register">
        <label>Full Name
          <input type="text" name="name" placeholder="Your name" required>
        </label>
        <label>Email
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>Password
          <input type="password" name="password" placeholder="At least 6 characters" minlength="6" required>
        </label>
        <label>Confirm Password
          <input type="password" name="confirmPassword" placeholder="Repeat your password" minlength="6" required>
        </label>
        <button class="btn full" type="submit">Create Account</button>
      </form>
      <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <footer><p>© 2026 InkSpace.</p></footer>
  <script src="js/script.js"></script>
</body>
</html>
